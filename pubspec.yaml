name: moabook
description: "모아북 — 독서 기록 앱 (Android + iOS 통합 Flutter 재구축)"
publish_to: 'none'

version: 2.0.12+47

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 네트워크
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # 저장소
  flutter_secure_storage: ^10.3.0

  # 소셜 로그인
  kakao_flutter_sdk_user: ^1.9.10
  flutter_naver_login: ^2.1.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # 바코드 스캐너
  mobile_scanner: ^7.2.0

  # 외부 링크 열기
  url_launcher: ^6.3.1

  # HTML 엔티티 디코딩 (알라딘 API description 에 &lt; &gt; 등이 포함됨)
  html_unescape: ^2.0.0

  # 홈 스크린 위젯 브리지 (Android Glance, iOS WidgetKit)
  home_widget: ^0.7.0

  # 푸시 알림 (FCM + 로컬 알림)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  timezone: ^0.9.4 # zonedSchedule (C 로컬 알림 7일 예약)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.4
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 29

flutter:
  uses-material-design: true
  config:
    enable-lldb-debugging: false
  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: DungGeunMo
      fonts:
        - asset: assets/fonts/dunggeunmo.ttf
    - family: WantedSans
      fonts:
        - asset: assets/fonts/wanted_sans_regular.ttf
          weight: 400
        - asset: assets/fonts/wanted_sans_semibold.ttf
          weight: 600
