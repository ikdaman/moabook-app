name: moabook
description: "모아북 — 독서 기록 앱 (Android + iOS 통합 Flutter 재구축)"
publish_to: 'none'

version: 2.0.1+25

environment:
  sdk: ^3.12.0

dependency_overrides:
  flutter_naver_login:
    path: patches/flutter_naver_login

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 네트워크
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # 저장소
  flutter_secure_storage: ^10.3.0

  # 소셜 로그인
  kakao_flutter_sdk_user: ^1.9.10
  flutter_naver_login: ^2.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # 바코드 스캐너
  mobile_scanner: ^7.2.0

  # 외부 링크 열기
  url_launcher: ^6.3.1

  # 홈 스크린 위젯 브리지 (Android Glance, iOS WidgetKit)
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.4
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 29

flutter:
  uses-material-design: true
  config:
    enable-lldb-debugging: false
  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: DungGeunMo
      fonts:
        - asset: assets/fonts/dunggeunmo.ttf
    - family: WantedSans
      fonts:
        - asset: assets/fonts/wanted_sans_regular.ttf
          weight: 400
        - asset: assets/fonts/wanted_sans_semibold.ttf
          weight: 600
