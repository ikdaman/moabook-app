name: moabook
description: "모아북 — 독서 기록 앱 (Android + iOS 통합 Flutter 재구축)"
publish_to: 'none'

version: 2.0.0+23

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.8.1

  # 네트워크
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # 저장소
  flutter_secure_storage: ^9.2.2

  # UI
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: DungGeunMo
      fonts:
        - asset: assets/fonts/dunggeunmo.ttf
    - family: WantedSans
      fonts:
        - asset: assets/fonts/wanted_sans_regular.ttf
          weight: 400
        - asset: assets/fonts/wanted_sans_semibold.ttf
          weight: 600
