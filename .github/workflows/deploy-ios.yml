name: Deploy to TestFlight

on:
  push:
    tags:
      - 'ios-v*'

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from pubspec
        id: version
        run: |
          # pubspec.yaml 의 'version: X.Y.Z+N' 을 단일 source 로 사용한다.
          # 태그 (ios-vX.Y.Z) 는 워크플로 트리거 전용이며 pubspec 과 매치되어야 한다.
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${PUBSPEC_VERSION%+*}
          VERSION_CODE=${PUBSPEC_VERSION#*+}
          TAG_VERSION=${GITHUB_REF#refs/tags/ios-v}
          if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != pubspec version ($VERSION_NAME). pubspec.yaml 을 먼저 bump 하고 동일 버전의 태그를 푸시하세요."
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 --decode > .env
          echo "✅ .env created ($(wc -l < .env) lines, $(wc -c < .env) bytes)"

      - name: Decode App Store Connect API Key
        run: echo "${{ secrets.APP_STORE_API_KEY_BASE64 }}" | base64 --decode > ios/fastlane/AuthKey_35SHWLN842.p8

      - name: Clean and install dependencies
        run: flutter clean && flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Flutter iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=.env \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }}

      - name: Deploy to TestFlight
        run: |
          cd ios
          bundle exec fastlane deploy_testflight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_PATH: fastlane/AuthKey_35SHWLN842.p8
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/gym/Runner-Runner.log
            ios/build/
          retention-days: 7

      - name: Summary
        run: echo "✅ Deployed v${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }} to TestFlight"
